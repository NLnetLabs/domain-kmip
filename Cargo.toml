[package]
name = "domain-kmip"
description = "KMIP HSM signing support for `domain`."
authors = ["NLnet Labs <dns-team@nlnetlabs.nl>"]
version = "0.0.1"

edition = "2024"
# The MSRV is at least 4 versions behind stable (about half a year).
rust-version = "1.88.0"

license = "BSD-3-Clause"
readme = "README.md"

keywords = ["DNS", "domain", "KMIP"]
homepage = "https://nlnetlabs.nl/projects/domain/"
repository = "https://github.com/nlnetlabs/domain-kmip/"

[features]
default = ["kmip-protocol/aws-lc-rs"]
ring = ["kmip-protocol/ring"]

[dependencies]
maybe-async = "0.2.11"

# This crate provides extensions to 'domain'.
[dependencies.domain]
package = "domain"
version = "0.12.3"
features = ["openssl", "unstable-crypto-sign"]
# TODO: Switch to using the crates.io release version once
# https://github.com/NLnetLabs/domain/pull/762 is included in a new release of
# the domain crate.
git = "https://github.com/NLnetLabs/domain.git"
branch = "add-sha-512-digest-support"

# This crate needs some way to interact with KMIP servers.  This requires
# connecting to them using an appropriate transport protocol and understanding
# the wire format.
#
# - 'kmip-protocol' provides protocol definitions and high-level client/server
#   functionality.  It is maintained by us (NLnet Labs).
[dependencies.kmip-protocol]
# TODO: Convert to a regular 'version' spec.
git = "https://github.com/NLnetLabs/kmip-protocol.git" 
branch = "bump-dependencies"
# Disable the default features so that the user of this crate can override
# the default using features in this crate, which by default use the same
# default as kmip-protocol for consistency, i.e. the aws-lc-rs crypto backend
# is enabled by default. The user of this crate can opt to use the ring crypto
# backend instead by disabling the default features of this crate and enabling
# this crates ring feature.
default-features = false
features = ["tls-with-rustls"]

# KMIP specifies the format for cryptographic data, often relying on DER
# based formats.  DNS sometimes uses different formats, thereby requiring the
# re-encoding of these signatures.
#
# - 'bcder' provides a simple DER encoder and decoder.  It is maintained by us
#   (NLnet Labs).
#
# TODO: Perhaps try hard-coding the relevant DER decoding?
# TODO: Should 'kmip-protocol' provide this decoding support for us?
[dependencies.bcder]
version = "0.7.0"

# This crate expresses KMIP key information as a URL for simplicity.  It needs
# some way to conformantly serialize and deserialize URLs.
#
# - 'url' is a popular Rust library for handling URLs.
#
#   TODO: Maintenance status?
[dependencies.url]
version = "2.5.4"

# Ideally this crate wouldn't need tracing. It uses for two reasons:
#   1. To give some indication of at which step, during multi-step processes
#      such as key generation or signing, an issue occurred. This could be
#      avoided by enriching returned errors with additional context.
#
#   2. To give some indication of the reason for failure during signing
#      operations, as the domain SignRaw trait returns SignError which lacks
#      any context at all. This could be resolved by enriching the SignError
#      type to allow returning some context with the error.
#
# To avoid polluting the logs of the application using this crate the log
# messages are at debug and trace level and thus not expected to occur in the
# log output of the application by default.
[dependencies.tracing]
version = "0.1.40"

# TODO: Rely on 'kmip-protocol' to help us generate unique batch item IDs.
# Each KMIP connection could hold a 64-bit counter to assure uniqueness.
[dependencies.uuid]
version = "1.18.0"
features = ["v4"]


[dev-dependencies]

# TODO: See '[dependencies.tracing]'.
[dev-dependencies.tracing-subscriber]
version = "0.3.19"
features = ["env-filter"]

# NOTE: 'tracing-subscriber' transitively introduces 'lazy_static' with a low
# version specifier, resulting in compilation failures.
[dev-dependencies.lazy_static]
version = "1.5.0"
